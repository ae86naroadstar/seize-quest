<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17365d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>製図クエスト 200</title><style>
:root{--navy:#17365d;--blue:#2f75b5;--green:#548235;--orange:#c65911;--red:#c00000;--bg:#edf1f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#202630}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}header{padding:20px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}header h1{margin:0 0 5px}.screen{padding:16px}.hide{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu,.btn{border:0;border-radius:14px;padding:16px;color:#fff;background:var(--blue);font-weight:800;font-size:15px}.card{margin-top:14px;padding:20px;border-radius:18px;box-shadow:0 3px 16px #0002}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{text-align:center;background:#f3f5f7;padding:10px;border-radius:11px}.stat b{display:block;font-size:21px;color:var(--navy)}.prompt{padding:13px;margin:9px 0;border-radius:12px;background:#f4f7fa}.prompt small{display:block;color:#64748b}.prompt strong{font-size:20px}.answer{display:none;background:#eef6ff;border-left:5px solid var(--blue);padding:15px;border-radius:9px;line-height:1.7}.answer.on{display:block}.judge{display:none;grid-template-columns:repeat(3,1fr);gap:7px}.judge.on{display:grid}.tag{display:inline-block;padding:5px 8px;border-radius:20px;background:#d9eaf7;margin:2px;font-size:12px}.gold{background:#ffd966}.ok{background:var(--green)}.mid{background:var(--orange)}.ng{background:var(--red)}select{width:100%;padding:12px;border-radius:10px;margin:5px 0}.install{background:#7030a0;width:100%;margin-top:10px}.progress{height:8px;background:#ddd;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:#70ad47}.timer{text-align:center;color:var(--red);font-size:24px;font-weight:800}.notice{font-size:12px;color:#64748b;line-height:1.5}@media(max-width:420px){.grid{grid-template-columns:1fr}.prompt strong{font-size:18px}}</style></head><body><div class="app"><header><h1>🏨 製図クエスト 200</h1><div>対象・対策・目的の2択記憶トレーニング</div></header>
<section id="home" class="screen"><div class="stats"><div class="stat"><b id="total">0</b>収録</div><div class="stat"><b id="master">0</b>習得</div><div class="stat"><b id="best">0</b>最高連勝</div></div><div class="grid"><button class="menu" onclick="startMode('対象＋対策 → 目的')">対象＋対策<br>→ 目的</button><button class="menu" style="background:#c65911" onclick="startMode('対象＋目的 → 対策')">対象＋目的<br>→ 対策</button><button class="menu" style="background:#1f4e78" onclick="startField('建築計画')">建築計画</button><button class="menu" style="background:#7f6000" onclick="startField('構造計画')">構造計画</button><button class="menu" style="background:#375623" onclick="startField('設備計画')">設備計画</button><button class="menu" style="background:#7030a0" onclick="startWeak()">苦手のみ</button></div><div class="card"><select id="field"><option value="all">全分野</option><option>建築計画</option><option>構造計画</option><option>設備計画</option></select><select id="mode"><option value="all">両方の出題形式</option><option>対象＋対策 → 目的</option><option>対象＋目的 → 対策</option></select><button class="btn" style="width:100%" onclick="customStart()">自由練習</button><button id="installBtn" class="btn install hide">ホーム画面に追加</button><p class="notice">学習記録は端末内に保存されます。インストールボタンが表示されない場合は、HTTPSで公開したURLをChromeで開いてください。</p></div></section>
<section id="quiz" class="screen hide"><button onclick="goHome()">← ホーム</button><div class="stats"><div class="stat"><b id="streak">0</b>連勝</div><div class="stat"><b id="count">0</b>回答</div><div class="stat"><b id="correct">0</b>正解</div></div><div class="progress"><i id="bar"></i></div><div class="card"><span id="qfield" class="tag"></span><span id="qcat" class="tag"></span><span id="qrank" class="tag"></span><span id="qmode" class="tag"></span><div class="prompt"><small id="label1"></small><strong id="prompt1"></strong></div><div class="prompt"><small id="label2"></small><strong id="prompt2"></strong></div><div id="answer" class="answer"><b id="answerLabel"></b><br><span id="answerText"></span><hr><b>記述例</b><br><span id="example"></span></div><button id="showBtn" class="btn" style="width:100%" onclick="showAnswer()">答えを見る</button><div id="judge" class="judge"><button class="btn ok" onclick="judge(2)">○ 正解</button><button class="btn mid" onclick="judge(1)">△ 惜しい</button><button class="btn ng" onclick="judge(0)">× 不正解</button></div></div></section>
<script src="questions.js"></script><script>const D=window.QUESTIONS,K='seizu-pwa-200-v1';let state=JSON.parse(localStorage.getItem(K)||'{"cards":{},"best":0}'),pool=[],cur,streak=0,count=0,correct=0,deferredPrompt=null;const E=x=>document.getElementById(x);function save(){localStorage.setItem(K,JSON.stringify(state))}function renderHome(){E('total').textContent=D.length;E('master').textContent=Object.values(state.cards).filter(v=>v>=4).length;E('best').textContent=state.best||0}function begin(){streak=count=correct=0;E('home').classList.add('hide');E('quiz').classList.remove('hide');next()}function startMode(m){pool=D.filter(x=>x.mode===m);begin()}function startField(f){pool=D.filter(x=>x.field===f);begin()}function startWeak(){pool=D.filter(x=>(state.cards[x.id]||0)<2);if(!pool.length)pool=D.slice();begin()}function customStart(){let f=E('field').value,m=E('mode').value;pool=D.filter(x=>(f==='all'||x.field===f)&&(m==='all'||x.mode===m));begin()}function next(){cur=pool[Math.floor(Math.random()*pool.length)];E('qfield').textContent=cur.field;E('qcat').textContent=cur.category;E('qrank').textContent=cur.rank+'ランク';E('qrank').className='tag '+(cur.rank==='S'?'gold':'');E('qmode').textContent=cur.mode;E('label1').textContent=cur.label1;E('prompt1').textContent=cur.prompt1;E('label2').textContent=cur.label2;E('prompt2').textContent=cur.prompt2;E('answerLabel').textContent=cur.answerLabel;E('answerText').textContent=cur.answer;E('example').textContent=cur.example;E('answer').className='answer';E('showBtn').className='btn';E('showBtn').style.width='100%';E('judge').className='judge';stats()}function showAnswer(){E('answer').className='answer on';E('showBtn').className='hide';E('judge').className='judge on'}function judge(v){count++;if(v===2){correct++;streak++;state.cards[cur.id]=Math.min(5,(state.cards[cur.id]||0)+1)}else if(v===1){streak=0;state.cards[cur.id]=Math.max(1,state.cards[cur.id]||0)}else{streak=0;state.cards[cur.id]=0}state.best=Math.max(state.best||0,streak);save();next()}function stats(){E('streak').textContent=streak;E('count').textContent=count;E('correct').textContent=correct;E('bar').style.width=Math.min(count,100)+'%'}function goHome(){E('quiz').classList.add('hide');E('home').classList.remove('hide');renderHome()}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;E('installBtn').classList.remove('hide')});E('installBtn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;E('installBtn').classList.add('hide')});if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));renderHome();</script></body></html>
